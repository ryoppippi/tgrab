[package]
name = "agent-fetcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-fetcher"
path = "src/main.rs"

[lib]
name = "agent_fetcher"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
impit = { git = "https://github.com/apify/impit.git", branch = "master" }
quick-xml = "0.37"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[patch.crates-io]
h2 = { git = "https://github.com/apify/h2", rev = "7f393a728a8db07cabb1b78d2094772b33943b9a" }
rustls = { git = "https://github.com/apify/rustls", rev = "d19ecc2b4e38978c1c3acabc98a221fa98b9314f" }
tower-http = { git = "https://github.com/apify/tower-http", rev = "f9efc0d9193e774d33aedc1022b922efefc22052" }
hyper-util = { git = "https://github.com/apify/hyper-util", rev = "9b7795dfd7158fc55e7c84b65bf1dae1d2dea67d" }
